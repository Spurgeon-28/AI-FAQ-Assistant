<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Naan Mudhalvan AI FAQ Assistant</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .chat-container {
            width: 90%;
            max-width: 700px;
            height: 85vh;
            background: white;
            border-radius: 18px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.12);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .header {
            background: #174ea6;
            color: white;
            padding: 22px;
            text-align: center;
        }

        .header h1 {
            margin: 0;
            font-size: 24px;
        }

        .header p {
            margin: 7px 0 0;
            font-size: 14px;
        }

        .chat-box {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
        }

        .message {
            margin-bottom: 15px;
            display: flex;
        }

        .user {
            justify-content: flex-end;
        }

        .bot {
            justify-content: flex-start;
        }

        .message span {
            max-width: 75%;
            padding: 12px 16px;
            border-radius: 15px;
            line-height: 1.5;
        }

        .user span {
            background: #174ea6;
            color: white;
            border-bottom-right-radius: 4px;
        }

        .bot span {
            background: #eef2f7;
            color: #222;
            border-bottom-left-radius: 4px;
        }

        .input-area {
            display: flex;
            padding: 15px;
            border-top: 1px solid #ddd;
            gap: 10px;
        }

        #question {
            flex: 1;
            padding: 13px;
            border: 1px solid #ccc;
            border-radius: 10px;
            font-size: 15px;
            outline: none;
        }

        button {
            padding: 13px 20px;
            border: none;
            border-radius: 10px;
            background: #174ea6;
            color: white;
            cursor: pointer;
            font-size: 15px;
        }

        button:hover {
            background: #123d82;
        }
    </style>
</head>

<body>

<div class="chat-container">

    <div class="header">
        <h1>🤖 Naan Mudhalvan AI FAQ Assistant</h1>
        <p>Ask questions about courses, registration, training and placements</p>
    </div>

    <div class="chat-box" id="chatBox">

        <div class="message bot">
            <span>
                Hello! 👋 I'm the Naan Mudhalvan AI FAQ Assistant.
                How can I help you?
            </span>
        </div>

    </div>

    <div class="input-area">

        <input
            type="text"
            id="question"
            placeholder="Ask your question..."
            onkeydown="handleKey(event)"
        >

        <button onclick="askQuestion()">Send</button>

    </div>

</div>

<script>

async function askQuestion() {

    const input = document.getElementById("question");
    const question = input.value.trim();

    if (!question) {
        return;
    }

    addMessage(question, "user");

    input.value = "";

    try {

        const response = await fetch("/ask", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                question: question
            })
        });

        const data = await response.json();

        addMessage(data.answer, "bot");

    } catch (error) {

        addMessage(
            "Sorry, something went wrong. Please try again.",
            "bot"
        );

    }
}


function addMessage(message, sender) {

    const chatBox = document.getElementById("chatBox");

    const messageDiv = document.createElement("div");

    messageDiv.className = "message " + sender;

    const span = document.createElement("span");

    span.textContent = message;

    messageDiv.appendChild(span);

    chatBox.appendChild(messageDiv);

    chatBox.scrollTop = chatBox.scrollHeight;
}


function handleKey(event) {

    if (event.key === "Enter") {
        askQuestion();
    }

}

</script>

</body>
</html>
